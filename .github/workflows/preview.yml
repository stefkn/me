name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# The GITHUB_TOKEN needs write access to push previews to the gh-pages
# branch and to leave a comment on the pull request.
permissions:
  contents: write
  pull-requests: write

# One preview deployment per PR at a time.
concurrency: preview-${{ github.ref }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        if: github.event.action != 'closed'
        run: |
          npm ci
          npx astro build \
            --site "https://stefkn.github.io" \
            --base "/personal-site/pr-preview/pr-${{ github.event.number }}"

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          wait-for-pages-deployment: true
          qr-code: true
