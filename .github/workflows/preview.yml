name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# The GITHUB_TOKEN needs write access to push previews to the gh-pages
# branch and to leave a comment on the pull request.
permissions:
  contents: write
  pull-requests: write
  pages: read

# One preview deployment per PR at a time.
concurrency: preview-${{ github.event.number }}

jobs:
  deploy-preview:
    # Fork PRs don't have a write-capable GITHUB_TOKEN, so skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        if: github.event.action != 'closed'
        env:
          ASTRO_BASE: /personal-site/pr-preview/pr-${{ github.event.number }}
        run: |
          npm ci
          npx astro build

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          wait-for-pages-deployment: true
